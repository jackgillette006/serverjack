# Reverse-proxy example for people NOT using tailscale serve.
# https://github.com/jackgillette006/serverjack
# serverjack has no login of its own: put real authentication in front of this
# (VPN-only interface, mTLS, an SSO proxy like oauth2-proxy / Authelia), or
# everyone who can reach it gets a shell as your user. If your proxy can supply
# a verified identity, have it set Tailscale-User-Login (stripping any copy the
# client sent) and set SERVERJACK_ALLOW to the logins you accept.
#
# Two ways to reach the two services, matching SERVERJACK_LISTEN in
# ~/.config/serverjack/env. The /term/ path below must match SERVERJACK_TERM.
server {
    listen 443 ssl;
    server_name term.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    # --- SERVERJACK_LISTEN=tcp (the default): 127.0.0.1:7680 and :7681
    # (SERVERJACK_PORT and TTYD_PORT). serverjack looks up the owner of every
    # connection in /proc/net/tcp and only answers root and its own user, so an
    # nginx whose *workers* run as someone else (uid 101 on nginx:alpine, 33 for
    # www-data on Debian) gets a 403 until you list that uid:
    #
    #     SERVERJACK_TRUST_UIDS=101
    #
    # in ~/.config/serverjack/env. Check the WORKER uid, not the master's --
    # `ps -o uid,cmd -C nginx`. (SERVERJACK_TRUST_LOCAL=1 disables the check
    # altogether; that hands every local account a shell, so don't.)
    # ttyd has no such check, but bin/tmux-attach.sh refuses to attach without
    # a token minted by the page, which covers it.
    location /term/ {
        proxy_pass http://127.0.0.1:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:7680;
        proxy_set_header Host $host;
    }

    # --- SERVERJACK_LISTEN=unix: private sockets in the owner's runtime dir.
    # No uid list to maintain, but that directory is mode 0700, so nginx has to
    # run as the same Unix account (a user-level nginx, or `user <owner>;` in
    # nginx.conf) -- running as www-data will get "permission denied" no matter
    # how the socket is chmod'ed. 1000 below is the owner's uid.
    # location /term/ {
    #     proxy_pass http://unix:/run/user/1000/serverjack/ttyd.sock:/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
    # location / {
    #     proxy_pass http://unix:/run/user/1000/serverjack/web.sock:/;
    #     proxy_set_header Host $host;
    # }
}
