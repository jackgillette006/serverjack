# Reverse-proxy example for people NOT using tailscale serve.
# https://github.com/jackgillette006/serverjack
# serverjack has no login of its own: put real authentication in front of this
# (VPN-only interface, mTLS, an SSO proxy like oauth2-proxy / Authelia), or
# everyone who can reach it gets a shell as your user.
#
# 127.0.0.1:7680 and :7681 are SERVERJACK_PORT and TTYD_PORT from
# ~/.config/serverjack/env; the /term/ path below must match SERVERJACK_TERM.
server {
    listen 443 ssl;
    server_name term.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    # ttyd: prefix stripped (trailing slash on proxy_pass), WebSocket upgrade
    location /term/ {
        proxy_pass http://127.0.0.1:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:7680;
        proxy_set_header Host $host;
    }
}
