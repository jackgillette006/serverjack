# Reverse-proxy example for people NOT using tailscale serve.
# https://github.com/jackgillette006/serverjack
# serverjack has no login of its own: put real authentication in front of this
# (VPN-only interface, mTLS, an SSO proxy like oauth2-proxy / Authelia), or
# everyone who can reach it gets a shell as your user.
#
# ONE backend. serverjack serves the terminal itself, reverse-proxying
# SERVERJACK_TERM (default /term/) to ttyd on a private Unix socket, so
# everything -- page, JSON API and terminal -- goes to the same place and
# through the same checks. Proxy "/" and pass the WebSocket upgrade through.
#
# Set SERVERJACK_HOSTS to the name below (term.example.com) in
# ~/.config/serverjack/env, or serverjack answers 421 "unknown Host": it only
# accepts localhost, its own hostname, its tailnet name and what you list.
server {
    listen 443 ssl;
    server_name term.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    # --- SERVERJACK_LISTEN=tcp (the default): 127.0.0.1:7680 (SERVERJACK_PORT).
    # serverjack looks up the owner of every connection in /proc/net/tcp and
    # only answers root and its own user, so an nginx whose *workers* run as
    # someone else (uid 101 on nginx:alpine, 33 for www-data on Debian) gets a
    # 403 until you list that uid:
    #
    #     SERVERJACK_TRUST_UIDS=101
    #
    # in ~/.config/serverjack/env. Check the WORKER uid, not the master's --
    # `ps -o uid,cmd -C nginx`. (SERVERJACK_TRUST_LOCAL=1 disables the check
    # altogether; that hands every local account a shell, so don't.)
    location / {
        proxy_pass http://127.0.0.1:7680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # see map below
        proxy_set_header Host $host;
        # Identity: serverjack only believes Tailscale-User-Login from a uid it
        # is told to trust (root/tailscaled by default), but strip the client's
        # copy anyway so it can never reach the app.
        proxy_set_header Tailscale-User-Login "";
        # If THIS proxy authenticates the user itself, set the header to the
        # verified login instead of "" and add nginx's WORKER uid to
        # SERVERJACK_TRUST_IDENTITY_UIDS (e.g. =101) so serverjack reads it.
        # Do that only when the two lines above and below really are enforced --
        # any uid listed there can name any user.
        #   proxy_set_header Tailscale-User-Login $verified_login;
        proxy_read_timeout 3600s;    # the terminal WebSocket is idle for hours
    }

    # --- SERVERJACK_LISTEN=unix: a private socket in the owner's runtime dir.
    # No uid list to maintain, but that directory is mode 0700, so nginx has to
    # run as the same Unix account (a user-level nginx, or `user <owner>;` in
    # nginx.conf) -- running as www-data will get "permission denied" no matter
    # how the socket is chmod'ed. 1000 below is the owner's uid.
    # location / {
    #     proxy_pass http://unix:/run/user/1000/serverjack/web.sock:/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_set_header Tailscale-User-Login "";
    #     proxy_read_timeout 3600s;
    # }
}

# Needed by the Connection header above: "upgrade" for a WebSocket, "" for an
# ordinary request. Goes in the http { } block, not inside server { }.
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      '';
#   }
