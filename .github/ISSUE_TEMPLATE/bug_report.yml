name: Bug report
description: Report reproducible serverjack behavior
title: "[bug] "
labels:
  - maintainer-attention
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve serverjack. Remove usernames, home paths,
        hostnames, tailnet identities, credentials, private URLs, and unrelated
        terminal output before submitting. Report vulnerabilities through the
        private process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA, with no private session link.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, browser/device, tmux version, and ttyd version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional relevant output after removing private data.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private URLs, identifying paths, and unrelated terminal output.
          required: true
        - label: This report does not disclose a vulnerability.
          required: true
