name: Maintainer attention

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  GH_REPO: ${{ github.repository }}
  ATTENTION_LABEL: maintainer-attention

jobs:
  queue-issue:
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maintainer-attention-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Add to the maintainer queue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh label create "$ATTENTION_LABEL" \
            --color D93F0B \
            --description "Needs maintainer triage" \
            --force
          gh issue edit "$NUMBER" --add-label "$ATTENTION_LABEL"

  queue-pull-request:
    if: >-
      (github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maintainer-attention-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Add to the maintainer queue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh label create "$ATTENTION_LABEL" \
            --color D93F0B \
            --description "Needs maintainer triage" \
            --force
          gh issue edit "$NUMBER" --add-label "$ATTENTION_LABEL"

  record-ci-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'),
      github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maintainer-attention-ci
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CI_LABEL: ci-failed
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Open or update the CI attention issue
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            echo "Ignoring a stale CI result."
            exit 0
          fi
          read -r latest_attempt latest_conclusion < <(
            gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" \
              --jq '[.run_attempt, .conclusion] | @tsv'
          )
          if [[ "$latest_attempt" != "$RUN_ATTEMPT" ||
                "$latest_conclusion" != "$RUN_CONCLUSION" ]]; then
            echo "Ignoring a superseded CI attempt."
            exit 0
          fi
          gh label create "$ATTENTION_LABEL" \
            --color D93F0B \
            --description "Needs maintainer triage" \
            --force
          gh label create "$CI_LABEL" \
            --color B60205 \
            --description "The CI workflow is failing" \
            --force
          issue_number=$(gh issue list \
            --state open \
            --label "$CI_LABEL" \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "CI failure needs attention") | .number' \
            | head -n 1)
          message="CI failed on branch ${HEAD_BRANCH} at ${HEAD_SHA:0:12}. Run: ${RUN_URL}"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "$message"
          else
            gh issue create \
              --title "CI failure needs attention" \
              --label "$ATTENTION_LABEL,$CI_LABEL" \
              --body "$message"
          fi

  close-ci-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maintainer-attention-ci
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CI_LABEL: ci-failed
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Close the CI attention issue after recovery
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            echo "Ignoring a stale CI result."
            exit 0
          fi
          read -r latest_attempt latest_conclusion < <(
            gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" \
              --jq '[.run_attempt, .conclusion] | @tsv'
          )
          if [[ "$latest_attempt" != "$RUN_ATTEMPT" ||
                "$latest_conclusion" != "$RUN_CONCLUSION" ]]; then
            echo "Ignoring a superseded CI attempt."
            exit 0
          fi
          issue_number=$(gh issue list \
            --state open \
            --label "$CI_LABEL" \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "CI failure needs attention") | .number' \
            | head -n 1)
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --reason completed \
              --comment "CI recovered. Run: ${RUN_URL}"
          fi

  record-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maintainer-attention-release-${{ github.event.release.id }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_LABEL: release-follow-up
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
    steps:
      - name: Create the post-release check
        run: |
          set -euo pipefail
          gh label create "$ATTENTION_LABEL" \
            --color D93F0B \
            --description "Needs maintainer triage" \
            --force
          gh label create "$RELEASE_LABEL" \
            --color 1D76DB \
            --description "Post-release verification" \
            --force
          title="Post-release check: ${RELEASE_TAG}"
          issue_number=""
          while IFS=$'\t' read -r number existing_title; do
            if [[ "$existing_title" == "$title" ]]; then
              issue_number=$number
              break
            fi
          done < <(gh issue list \
            --state all \
            --label "$RELEASE_LABEL" \
            --limit 100 \
            --json number,title \
            --jq '.[] | [.number, .title] | @tsv')
          if [[ -n "$issue_number" ]]; then
            echo "Post-release issue already exists: ${issue_number}"
          else
            gh issue create \
              --title "$title" \
              --label "$ATTENTION_LABEL,$RELEASE_LABEL" \
              --body "Verify install, upgrade, and release assets for ${RELEASE_TAG}: ${RELEASE_URL}"
          fi

  health-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Confirm the watcher is installed
        run: echo "Maintainer attention workflow is active."
