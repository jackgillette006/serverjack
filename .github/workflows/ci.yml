name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-security-tests:
    name: Browser and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux

      - name: Install ttyd (pinned)
        # Not `apt-get install ttyd`: ubuntu-24.04's archive carries 1.7.4,
        # whose client does not apply a ?theme=... URL query at all -- real
        # installs get whatever install.sh pins (see scripts/fetch-ttyd.sh,
        # shared by both), and CI needs the same one or a real regression in
        # that gap passes here silently. Installed where tests/run.sh's own
        # `PATH="$HOME/.local/bin:$PATH"` already looks, matching a real
        # install's layout.
        run: bash scripts/fetch-ttyd.sh "$HOME/.local/bin/ttyd"

      - name: Run isolated browser and security tests
        run: bash tests/run.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-diagnostics
          path: |
            tests/shots/*.log
            tests/shots/*.png
          if-no-files-found: warn
          retention-days: 7

  install-suites:
    name: Install suites (managed + guided)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Deliberately NOT added to required status checks yet (round 3, cut-tier
    # item 13) -- these two container suites need real systemd inside a
    # --privileged container, which no other job here exercises, so this
    # earns its own job rather than piggybacking on browser-security-tests.
    # Unlike `bash tests/run.sh managed-install`/`guided-install` run
    # locally (which skip with exit 0 when docker can't do privileged
    # containers at all -- a normal, graceful thing on a laptop with no
    # docker, or podman-only, etc.), THIS job must fail loudly instead: a
    # GitHub-hosted ubuntu-24.04 runner losing that capability is itself
    # worth knowing about, not something to quietly report green over.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm this runner can start a privileged systemd container
        run: |
          if ! docker run --rm --privileged -e container=docker debian:13-slim true; then
            echo "::error::this runner cannot start a --privileged container -- managed-install/guided-install need real systemd inside one, and this job fails loudly instead of silently skipping (unlike tests/run.sh's own local skip path)." >&2
            exit 1
          fi

      - name: Managed install suite
        run: bash tests/run.sh managed-install

      - name: Guided install suite
        run: bash tests/run.sh guided-install

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-suites-diagnostics
          path: |
            tests/shots/managed-install.log
            tests/shots/guided-install.log
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/w -w /w koalaman/shellcheck-alpine:stable \
            shellcheck -S warning install.sh uninstall.sh bin/serverjack-ttyd \
            bin/serverjack-ctl bin/serverjack-setup bin/serverjack-lib.sh \
            bin/tmux-attach.sh bin/tmux-picker.sh \
            tests/run.sh tests/security-wrapper.sh tests/managed-install.sh \
            tests/guided-install.sh tests/launcher.sh tests/ctl-health.sh \
            tests/read-tailscale-self.sh tests/wsl-detect.sh \
            tests/fixtures/fake-tailscale.sh tests/fixtures/fake-sudo-wrapper.sh \
            tests/fixtures/prestart-hook.sh scripts/build-release.sh \
            scripts/export-launcher.sh bootstrap/serverjack-bootstrap.sh.in \
            bootstrap/launcher.sh scripts/fetch-ttyd.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: pyflakes
        run: |
          pip install --disable-pip-version-check pyflakes
          python3 -m pyflakes bin/serverjack bin/ttyd-ws-check.py tests/*.py scripts/check-readme-anchors.py

      - name: README anchor links (A14)
        run: python3 scripts/check-readme-anchors.py README.md

      - name: py_compile under Python 3.9
        run: |
          docker run --rm -v "$PWD":/w -w /w python:3.9-slim \
            python3 -m py_compile bin/serverjack bin/ttyd-ws-check.py tests/*.py scripts/check-readme-anchors.py
