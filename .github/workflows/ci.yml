name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-security-tests:
    name: Browser and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux ttyd

      - name: Run isolated browser and security tests
        run: bash tests/run.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-diagnostics
          path: |
            tests/shots/*.log
            tests/shots/*.png
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/w -w /w koalaman/shellcheck-alpine:stable \
            shellcheck -S warning install.sh uninstall.sh bin/serverjack-ttyd \
            bin/tmux-attach.sh bin/tmux-picker.sh tests/run.sh tests/security-wrapper.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: pyflakes
        run: |
          pip install --disable-pip-version-check pyflakes
          python3 -m pyflakes bin/serverjack bin/ttyd-ws-check.py tests/*.py

      - name: py_compile under Python 3.9
        run: |
          docker run --rm -v "$PWD":/w -w /w python:3.9-slim \
            python3 -m py_compile bin/serverjack bin/ttyd-ws-check.py tests/*.py
