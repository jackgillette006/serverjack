<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>serverjack</title>
<style>
  /* Values filled in by make-social.sh, which loads bin/serverjack and reads
     them straight out of its own TOKENS block -- never hand-copied here, so
     this can't drift from what actually ships. */
  :root{
    --bg-primary:__BG_PRIMARY__;
    --text-primary:__TEXT_PRIMARY__;
    --text-secondary:__TEXT_SECONDARY__;
    --accent:__ACCENT__;
    --font-mono:__FONT_MONO__;
    --font-ui:__FONT_UI__;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{
    background:var(--bg-primary);
    background-image:repeating-linear-gradient(180deg,rgb(57 255 136 / .02) 0 1px,transparent 1px 3px);
    display:flex;align-items:center;justify-content:center;
  }
  .card{width:1280px;height:640px;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:center;padding:0 120px}
  .word{display:flex;align-items:center;gap:18px;color:var(--accent);
    font:600 40px/1 var(--font-mono);letter-spacing:-.01em;margin-bottom:56px}
  .word svg{flex:none}
  .word span{color:var(--text-primary)}
  h1{font:600 76px/1.15 var(--font-mono);color:var(--text-primary);
    letter-spacing:-.02em;margin-bottom:28px}
  p{font:400 32px/1.5 var(--font-ui);color:var(--text-secondary);max-width:1040px;text-wrap:balance}
</style>
</head>
<body>
  <div class="card">
    <div class="word">
      <svg width="44" height="44" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">__PROMPT_JACK_SVG__</svg>
      <span>serverjack</span>
    </div>
    <h1>Jack into your server.</h1>
    <p>Your coding agents, from your phone.<br>Lightweight, private, self-hosted.</p>
  </div>
</body>
</html>
