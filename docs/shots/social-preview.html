<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>serverjack</title>
<style>
  /* Tokens copied from bin/serverjack's own TOKENS block (docs/design/TOKENS.css
     is the design doc's copy; this matches what actually ships). */
  :root{
    --bg-primary:#080f0e;
    --text-primary:#e6f7e9;
    --text-secondary:#9fb3a8;
    --accent:#39ff88;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{
    background:var(--bg-primary);
    background-image:repeating-linear-gradient(180deg,rgb(57 255 136 / .02) 0 1px,transparent 1px 3px);
    display:flex;align-items:center;justify-content:center;
  }
  .card{width:1280px;height:640px;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:center;padding:0 120px}
  .word{display:flex;align-items:center;gap:18px;color:var(--accent);
    font:600 40px/1 var(--font-mono);letter-spacing:-.01em;margin-bottom:56px}
  .word svg{flex:none}
  .word span{color:var(--text-primary)}
  h1{font:600 76px/1.15 var(--font-mono);color:var(--text-primary);
    letter-spacing:-.02em;margin-bottom:28px}
  p{font:400 32px/1.5 var(--font-ui);color:var(--text-secondary);max-width:1040px;text-wrap:balance}
</style>
</head>
<body>
  <div class="card">
    <div class="word">
      <svg width="44" height="44" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M 35 15 Q 35 14 36 14 L 38 14 L 38 8 Q 38 7 39 7 L 41 7 Q 42 7 42 8 L 42 14 L 45 14 L 45 8 Q 45 7 46 7 L 48 7 Q 49 7 49 8 L 49 14 L 51 14 Q 52 14 52 15 L 52 23 Q 52 24 51 24 L 48 24 L 48 42 Q 48 56 34 56 L 23 56 Q 12 56 12 45 L 12 41 Q 12 40 13 40 L 20 40 Q 21 40 21 41 L 21 44 Q 21 47 24 47 L 34 47 Q 39 47 39 42 L 39 24 L 36 24 Q 35 24 35 23 Z"/><path d="M 21 22 Q 22.5 20.5 24 22 L 30.5 28.5 Q 32 30 30.5 31.5 L 24 38 Q 22.5 39.5 21 38 Q 19.5 36.5 21 35 L 26 30 L 21 25 Q 19.5 23.5 21 22 Z"/></svg>
      <span>serverjack</span>
    </div>
    <h1>Jack into your server.</h1>
    <p>Your coding agents, from your phone.<br>Lightweight, private, self-hosted.</p>
  </div>
</body>
</html>
