events {}
http {
  # 7699: the ordinary instance (no SERVERJACK_ALLOW) -- what most suites drive.
  server {
    listen 127.0.0.1:7699;
    location /term/ {
      proxy_pass http://127.0.0.1:7691/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host:$server_port;
      proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:7690; proxy_set_header Host $host:$server_port; }
  }
  # 7698: the identity-restricted instance (SERVERJACK_ALLOW=alice@example.com).
  # Playwright plays the part of `tailscale serve` by sending Tailscale-User-Login.
  server {
    listen 127.0.0.1:7698;
    location /term/ {
      proxy_pass http://127.0.0.1:7693/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host:$server_port;
      proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:7692; proxy_set_header Host $host:$server_port; }
  }
}
